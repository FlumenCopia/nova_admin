<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F2F4F7" />
    </linearGradient>
    <filter id="shadow3d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.12" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>
  <!-- Outer 3D Circle Plate -->
  <circle cx="100" cy="100" r="90" fill="url(#badgeBg)" stroke="#FFFFFF" stroke-width="5" filter="url(#shadow3d)" />
  <circle cx="100" cy="100" r="88" fill="none" stroke="#E5E8EC" stroke-width="1.5" />
  
  <!-- Logo Typography -->
  <text x="100" y="98" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="900" font-size="44" fill="#E51B24" letter-spacing="-0.5">NOVA</text>
  <text x="100" y="125" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="600" font-size="15" fill="#4E7A27" letter-spacing="3.5">innovations</text>
</svg>
