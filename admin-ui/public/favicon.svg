
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>
  
  <!-- Base Round Badge (Google Search & Browser Tab friendly) -->
  <circle cx="256" cy="256" r="244" fill="url(#bgPlate)" stroke="#E2E8F0" stroke-width="8" filter="url(#shadow)" />
  <circle cx="256" cy="256" r="240" fill="none" stroke="#FFFFFF" stroke-width="4" />

  <!-- Dynamic Green Arc Swoop -->
  <path d="M 148 136 C 210 94, 302 94, 364 136 C 322 114, 236 112, 172 136 Z" fill="#4E7A27" />

  <!-- Bold Brand NOVA Red Typography -->
  <text x="256" y="278" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="134" fill="#E51B24" letter-spacing="-1.5">NOVA</text>

  <!-- Green Innovations Subtitle -->
  <text x="256" y="348" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="38" fill="#4E7A27" letter-spacing="8">INNOVATIONS</text>
</svg>
