###############################################################################
# CloudPanel Nginx Configuration for Nova Innovations
# Production Reverse Proxy & Media Streaming Settings
###############################################################################

# =============================================================================
# SITE 1: Main Public Website & API (Domain: novainnovations.in, www.novainnovations.in)
# In CloudPanel -> Sites -> novainnovations.in -> Vhost tab
# =============================================================================

# 1. Allow large banner and portfolio uploads (up to 50MB)
client_max_body_size 50M;

# 2. Proxy Buffer Optimizations (prevents 502 Bad Gateway on large responses)
proxy_buffer_size 128k;
proxy_buffers 4 256k;
proxy_busy_buffers_size 256k;
proxy_read_timeout 300s;
proxy_connect_timeout 75s;

# 3. Main Next.js Website (Port 3000)
location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
}

# 4. Next.js Static Cache Optimization
location /_next/static/ {
    proxy_pass http://127.0.0.1:3000/_next/static/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
    expires 365d;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# 5. Express API Backend (Port 5000)
location /api/ {
    proxy_pass http://127.0.0.1:5000/api/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 6. Uploaded Media Assets (Port 5000 Static Directory)
location /uploads/ {
    proxy_pass http://127.0.0.1:5000/uploads/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, no-transform";
}


